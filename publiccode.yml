description:
  fr:
    shortDescription: Design System de l'Etat pour Shiny
    longDescription: >
      Le package {shinygouv} permet d'utiliser le Système de Design de
      l'État (DSFR) dans les applications Shiny. Il fournit des fonctions
      qui remplacent les composants standards de Shiny (header, fluidPage,
      fluidRow, fileInput, etc.) par leurs équivalents conformes à la
      charte graphique de l'État, ce qui permet aux applications R Shiny
      de l'administration française d'adopter le DSFR sans réécriture.
    features:
      - Composants Shiny conformes au Système de Design de l'État (DSFR)
      - Header, fluidPage, fluidRow et column adaptés au DSFR
      - Inputs DSFR (fileInput, selectInput, etc.)
    documentation: "https://spyrales.github.io/shinygouv/"
